name: Build GameNative NX

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout GameNative NX
        uses: actions/checkout@v4
      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=$DEVKITPRO"
          echo "devkitA64=$DEVKITPRO/devkitA64"

          test -d "$DEVKITPRO/devkitA64"
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"

          echo "make:"
          make --version | head -1

          echo "compiler:"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version | head -1
      
      - name: Fetch libsolder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/libsolder
          git clone --depth 1 https://github.com/fgsfdsfgs/libsolder.git third_party/libsolder

      - name: Check required Switch headers and libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEVKITPRO/libnx/include/switch.h"
          test -f "$DEVKITPRO/libnx/switch_rules"
          echo "libnx: OK"
          if [ -n "${PORTLIBS:-}" ]; then echo "PORTLIBS=$PORTLIBS"; fi

      - name: Build
        shell: bash
        run: make -j"$(nproc)"

      - name: Package Switch files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/switch/gamenative_nx
          cp gamenative_nx.nro gamenative_nx.nacp artifact/switch/gamenative_nx/
          cp README.md THIRD_PARTY_NOTICES.md artifact/switch/gamenative_nx/

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-nx
          path: artifact/
          if-no-files-found: error
